name: Generate snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#dc2626&color_dots=#ebedf0,#fecaca,#f87171,#dc2626,#7f1d1d
            dist/snake-dark.svg?palette=github-dark&color_snake=#dc2626&color_dots=#161b22,#450a0a,#7f1d1d,#b91c1c,#dc2626
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
